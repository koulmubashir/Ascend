    <script>
        const presets = {
            'rest': [],
            'push': ['chest', 'frontDelt', 'triceps'],
            'pull': ['lats', 'traps', 'rearDelt', 'biceps', 'forearm'],
            'legs': ['quads', 'hamstrings', 'glutes', 'calves', 'adductors'],
            'chest': ['chest', 'frontDelt'],
            'back': ['lats', 'traps', 'lowerBack'],
            'shoulders': ['frontDelt', 'sideDelt', 'rearDelt', 'traps'],
            'arms': ['biceps', 'triceps', 'forearm'],
            'core': ['abs', 'obliques'],
            'fullBody': ['chest', 'frontDelt', 'sideDelt', 'rearDelt', 'traps', 'lats', 'lowerBack', 'biceps', 'triceps', 'forearm', 'abs', 'obliques', 'quads', 'hamstrings', 'glutes', 'calves', 'adductors']
        };

        window.setRegions = function(activeRegions) {
            document.querySelectorAll('[data-region]').forEach(el => {
                const regionName = el.getAttribute('data-region');
                el.setAttribute('fill', activeRegions.includes(regionName) ? 'url(#activeGradient)' : '#dcdcdc');
            });
        };

        window.setPreset = function(presetName) {
            const regions = presets[presetName] || [];
            window.setRegions(regions);
        };

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialPreset = urlParams.get('preset') || 'rest';
            window.setPreset(initialPreset);
        });
    </script>
