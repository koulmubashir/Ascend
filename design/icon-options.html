<!doctype html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1120px; height: 460px;
    background: #e9e7e4;
    font-family: -apple-system, system-ui, sans-serif;
    display: flex; align-items: center; justify-content: center; gap: 44px;
  }
  .cell { text-align: center; }
  .icon { width: 300px; height: 300px; border-radius: 68px; overflow: hidden; display: block; }
  .label { margin-top: 14px; font-size: 17px; color: #55504c; font-weight: 500; }
</style>
</head>
<body>

  <!-- 1. Barbell: the most direct reading of "strength training" -->
  <div class="cell">
    <svg class="icon" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="g1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2a2724"/>
          <stop offset="1" stop-color="#121110"/>
        </linearGradient>
        <linearGradient id="o1" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb057"/>
          <stop offset="1" stop-color="#f04e14"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" fill="url(#g1)"/>
      <g transform="rotate(-30 256 256)">
        <rect x="118" y="243" width="276" height="26" rx="13" fill="url(#o1)"/>
        <rect x="128" y="196" width="42" height="120" rx="18" fill="url(#o1)"/>
        <rect x="342" y="196" width="42" height="120" rx="18" fill="url(#o1)"/>
        <rect x="84" y="222" width="30" height="68" rx="14" fill="url(#o1)" opacity="0.75"/>
        <rect x="398" y="222" width="30" height="68" rx="14" fill="url(#o1)" opacity="0.75"/>
      </g>
    </svg>
    <div class="label">1 · Barbell</div>
  </div>

  <!-- 2. Plate end-on, with an arc for progression -->
  <div class="cell">
    <svg class="icon" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="g2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2a2724"/>
          <stop offset="1" stop-color="#121110"/>
        </linearGradient>
        <linearGradient id="o2" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#ffb057"/>
          <stop offset="1" stop-color="#f04e14"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" fill="url(#g2)"/>
      <circle cx="256" cy="256" r="150" fill="none" stroke="#3a3633" stroke-width="34"/>
      <circle cx="256" cy="256" r="150" fill="none" stroke="url(#o2)" stroke-width="34"
              stroke-linecap="round" stroke-dasharray="707"
              stroke-dashoffset="212" transform="rotate(-90 256 256)"/>
      <rect x="238" y="196" width="36" height="120" rx="18" fill="url(#o2)"/>
      <rect x="196" y="243" width="120" height="26" rx="13" fill="url(#o2)"/>
    </svg>
    <div class="label">2 · Plate and progress</div>
  </div>

  <!-- 3. Upward chevrons: progression, no equipment -->
  <div class="cell">
    <svg class="icon" viewBox="0 0 512 512">
      <defs>
        <linearGradient id="g3" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#fff3e8"/>
          <stop offset="1" stop-color="#ffdcc0"/>
        </linearGradient>
        <linearGradient id="o3" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#f04e14"/>
          <stop offset="1" stop-color="#ffb057"/>
        </linearGradient>
      </defs>
      <rect width="512" height="512" fill="url(#g3)"/>
      <g fill="none" stroke="url(#o3)" stroke-width="42" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="140,300 256,184 372,300"/>
        <polyline points="140,392 256,276 372,392" opacity="0.42"/>
      </g>
    </svg>
    <div class="label">3 · Rising</div>
  </div>

</body>
</html>
