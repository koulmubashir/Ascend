<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Today screen</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{
    background:#e9e7e4;
    font-family:Inter,-apple-system,system-ui,sans-serif;
    display:flex;justify-content:center;padding:36px 20px;
  }
  .phone{
    width:390px;background:#fff;border-radius:44px;
    border:1px solid #d5d2ce;overflow:hidden;
    display:flex;flex-direction:column;
  }
  .status{
    display:flex;justify-content:space-between;align-items:center;
    padding:14px 26px 6px;font-size:13px;font-weight:600;color:#1c1a18;
  }
  .hd{padding:8px 22px 0;display:flex;justify-content:space-between;align-items:flex-start}
  .day{font-size:13px;color:#8a837e;font-weight:500}
  .title{font-size:24px;font-weight:600;color:#1c1a18;letter-spacing:-.02em;margin-top:2px}
  .streak{
    display:flex;align-items:center;gap:5px;background:#fdf0e6;
    color:#c2521a;font-size:12px;font-weight:600;
    padding:6px 11px;border-radius:999px;
  }
  .map{padding:4px 20px 0}
  .map img{width:100%;display:block}
  .tags{display:flex;gap:7px;padding:0 22px;flex-wrap:wrap;margin-top:-6px}
  .tag{
    font-size:12.5px;font-weight:500;background:#fdefe5;color:#c2521a;
    padding:5px 12px;border-radius:999px;
  }
  .tag.off{background:#f2f0ed;color:#8a837e}
  .cta{padding:16px 22px 10px}
  .cta button{
    width:100%;border:0;border-radius:14px;background:#1c1a18;color:#fff;
    font:inherit;font-size:15px;font-weight:600;padding:15px;cursor:pointer;
  }
  .week{
    display:flex;justify-content:space-between;align-items:center;
    padding:2px 24px 22px;
  }
  .dots{display:flex;gap:7px}
  .dot{width:9px;height:9px;border-radius:50%;background:#e4e1dd}
  .dot.done{background:#3f9c6d}
  .dot.now{background:#f2571b;box-shadow:0 0 0 3px #fdefe5}
  .meta{font-size:12px;color:#a49d98}
  .bar{height:5px;width:130px;background:#dedad6;border-radius:999px;margin:0 auto 10px}
</style>
</head>
<body>
  <div class="phone">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="hd">
      <div>
        <div class="day">Day 3 of 5</div>
        <div class="title">Push day</div>
      </div>
      <div class="streak">5 day streak</div>
    </div>
    <div class="map"><img src="__IMG__" alt="Body map with chest, shoulders and triceps highlighted"></div>
    <div class="tags">
      <span class="tag">Chest</span>
      <span class="tag">Shoulders</span>
      <span class="tag">Triceps</span>
      <span class="tag off">Back</span>
      <span class="tag off">Legs</span>
    </div>
    <div class="cta"><button>Start workout</button></div>
    <div class="week">
      <div class="dots">
        <span class="dot done"></span><span class="dot done"></span>
        <span class="dot now"></span><span class="dot"></span><span class="dot"></span>
      </div>
      <span class="meta">Mon–Fri plan</span>
    </div>
    <div class="bar"></div>
  </div>
</body>
</html>
